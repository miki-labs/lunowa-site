<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lunowa return-context visual authority</title>
  <desc id="desc">A source-grounded return state explaining what changed, what remains, and how to open the quotation or original email.</desc>
  <rect width="1200" height="720" fill="#F8F8F5"/>
  <g font-family="Inter Variable, Noto Sans JP, Hiragino Sans, Yu Gothic UI, Yu Gothic, sans-serif" fill="#181817">
    <text x="600" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#355F91">戻ってきた時には、何が変わったかも分かる。</text>
    <text x="600" y="126" text-anchor="middle" font-size="36" font-weight="700">見積書が届きました</text>
    <text x="600" y="160" text-anchor="middle" font-size="16" fill="#686864">金額と納期を確認してください。</text>

    <rect x="210" y="202" width="780" height="442" rx="20" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="246" y="246" font-size="12" font-weight="600" fill="#8A571C">対応が必要</text>
    <text x="246" y="288" font-size="24" font-weight="700">今の要点</text>

    <line x1="246" y1="314" x2="954" y2="314" stroke="#E1E1DC"/>

    <text x="246" y="354" font-size="12" font-weight="600" fill="#777772">変わったこと</text>
    <text x="398" y="354" font-size="15">山田商事から見積書が届きました。</text>

    <text x="246" y="398" font-size="12" font-weight="600" fill="#777772">残っていること</text>
    <text x="398" y="398" font-size="15">金額と納期の確認</text>

    <text x="246" y="442" font-size="12" font-weight="600" fill="#777772">根拠</text>
    <text x="398" y="442" font-size="15">「見積書を添付しました。ご確認ください。」</text>

    <rect x="246" y="480" width="708" height="56" rx="10" fill="#F1F2EE" stroke="#D8D8D2"/>
    <text x="270" y="514" font-size="14" font-weight="600">見積書.pdf</text>
    <text x="900" y="514" text-anchor="end" font-size="12" fill="#686864">添付ファイル</text>

    <rect x="246" y="560" width="154" height="46" rx="10" fill="#181817"/>
    <text x="323" y="589" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">見積書を開く</text>
    <text x="430" y="589" font-size="14" font-weight="600" fill="#355F91">元のメールを見る →</text>
  </g>
</svg>
