<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Lunowa material-outcome attention state</title>
  <desc id="desc">The same quotation matter after the requested quotation arrives and user review becomes necessary.</desc>
  <rect width="1200" height="720" fill="#F8F8F5"/>
  <g font-family="Inter Variable, Noto Sans JP, Hiragino Sans, Yu Gothic UI, Yu Gothic, sans-serif" fill="#181817">
    <text x="72" y="70" font-size="14" font-weight="600" fill="#355F91">同じ用件に、必要な結果が届いた。</text>
    <text x="72" y="116" font-size="36" font-weight="700">必要になった時だけ、あなたに戻します。</text>
    <rect x="72" y="158" width="1056" height="498" rx="20" fill="#FFFFFF" stroke="#D8D8D2"/>
    <line x1="72" y1="220" x2="1128" y2="220" stroke="#D8D8D2"/>
    <text x="100" y="198" font-size="18" font-weight="700">Lunowa</text>
    <text x="965" y="197" font-size="12" fill="#777772">メールを検索</text>
    <line x1="252" y1="220" x2="252" y2="656" stroke="#D8D8D2"/>
    <rect x="88" y="244" width="148" height="40" rx="9" fill="#FFF5E8"/>
    <text x="108" y="270" font-size="14" font-weight="600" fill="#8A571C">対応が必要</text>
    <text x="98" y="320" font-size="12" fill="#777772">見守り中</text>
    <text x="98" y="355" font-size="12" fill="#777772">すべての会話</text>
    <text x="292" y="260" font-size="12" font-weight="600" fill="#777772">メールの会話</text>
    <text x="292" y="298" font-size="27" font-weight="700">Re: 見積書のお願い</text>
    <text x="292" y="328" font-size="14" fill="#686864">山田商事</text>
    <rect x="850" y="264" width="220" height="40" rx="10" fill="#FFF5E8"/>
    <text x="960" y="289" text-anchor="middle" font-size="13" font-weight="600" fill="#8A571C">見積書が届きました</text>
    <rect x="292" y="356" width="704" height="92" rx="16" fill="#FFF5E8" stroke="#E8D1B1"/>
    <circle cx="324" cy="402" r="13" fill="#8A571C"/>
    <text x="324" y="407" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">!</text>
    <text x="354" y="392" font-size="19" font-weight="700">あなたの確認が必要です</text>
    <text x="354" y="421" font-size="14" fill="#8A571C">見積書が届きました。金額と納期を確認してください。</text>
    <text x="292" y="492" font-size="12" font-weight="600" fill="#777772">最新の返信</text>
    <rect x="292" y="510" width="704" height="64" rx="10" fill="#F8F8F5" stroke="#D8D8D2"/>
    <text x="312" y="534" font-size="11" font-weight="600" fill="#686864">山田商事 ・ 14:42</text>
    <text x="312" y="558" font-size="15">見積書を添付しました。ご確認ください。</text>
    <rect x="292" y="590" width="316" height="42" rx="9" fill="#F1F2EE" stroke="#D8D8D2"/>
    <text x="312" y="616" font-size="13" font-weight="600">見積書.pdf</text>
    <text x="872" y="616" font-size="13" font-weight="600" fill="#355F91">元のメールを見る →</text>
  </g>
</svg>
