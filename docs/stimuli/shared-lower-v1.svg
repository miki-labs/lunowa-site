<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2200" viewBox="0 0 1440 2200" role="img" aria-labelledby="title desc">
  <title id="title">Lunowa shared lower-page continuation stimulus</title>
  <desc id="desc">Shared lower-page continuation for P-v1 and E-v1 explaining that reply does not necessarily mean completion, quiet monitoring, attention return, and source-grounded control.</desc>
  <!-- S05 shared lower continuation. Static only. Shared by P-v1/E-v1 after clean first-impression probe. -->
  <rect width="1440" height="2200" fill="#F8F8F5"/>
  <g font-family="Inter, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" fill="#181817">
    <text x="150" y="150" font-size="16" font-weight="650" fill="#355F91">メールの負担は、読むことだけではありません。</text>
    <text x="150" y="214" font-size="42" font-weight="750">「あの件、どうなった？」を</text>
    <text x="150" y="266" font-size="42" font-weight="750">頭の片隅に置き続けること。</text>
    <text x="150" y="312" font-size="18" fill="#686864">返信待ち、資料待ち、確認待ち。終わるまで何度も受信箱を見に戻る。</text>

    <line x1="120" y1="390" x2="1320" y2="390" stroke="#E0E0DA"/>
    <text x="720" y="468" text-anchor="middle" font-size="15" font-weight="650" fill="#355F91">返信が来ても、終わっていないことがある。</text>
    <text x="720" y="528" text-anchor="middle" font-size="38" font-weight="750">返信 ≠ 完了</text>
    <text x="720" y="566" text-anchor="middle" font-size="17" fill="#686864">Lunowaが見ているのは「返信の有無」ではなく、その用件で必要な結果が届いたかどうか。</text>

    <rect x="150" y="620" width="530" height="250" rx="16" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="182" y="660" font-size="12" font-weight="650" fill="#777772">途中返信</text>
    <text x="182" y="702" font-size="20" font-weight="700">社内確認中です。明日送ります。</text>
    <rect x="182" y="744" width="420" height="74" rx="11" fill="#EDF6F1"/>
    <text x="204" y="775" font-size="17" font-weight="720">あなたの対応はまだ必要ありません</text>
    <text x="204" y="801" font-size="13" fill="#66706A">見積書が届くまで、Lunowaが見守ります。</text>

    <rect x="760" y="620" width="530" height="250" rx="16" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="792" y="660" font-size="12" font-weight="650" fill="#777772">必要な結果が到着</text>
    <text x="792" y="702" font-size="20" font-weight="700">見積書を添付しました。ご確認ください。</text>
    <rect x="792" y="744" width="420" height="74" rx="11" fill="#FFF5E8"/>
    <text x="814" y="775" font-size="17" font-weight="720" fill="#8A571C">あなたの確認が必要です</text>
    <text x="814" y="801" font-size="13" fill="#735F49">見積書が届きました。金額と納期を確認してください。</text>

    <line x1="120" y1="950" x2="1320" y2="950" stroke="#E0E0DA"/>
    <text x="150" y="1035" font-size="16" font-weight="650" fill="#355F91">必要でない間は、Lunowaが見ています。</text>
    <text x="150" y="1095" font-size="38" font-weight="750">静かに任せる。</text>
    <text x="150" y="1137" font-size="17" fill="#686864">受信箱を何度も確認する代わりに、未完了の用件を見守り続けます。</text>
    <rect x="760" y="1005" width="530" height="178" rx="16" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="792" y="1044" font-size="12" fill="#777772">見守り中</text>
    <text x="792" y="1080" font-size="21" font-weight="720">山田商事 / 見積書</text>
    <text x="792" y="1112" font-size="14" fill="#696965">待っているもの：見積書</text>
    <text x="792" y="1144" font-size="14" font-weight="650" fill="#3D6D58">現在、あなたの対応は必要ありません。</text>

    <line x1="120" y1="1260" x2="1320" y2="1260" stroke="#E0E0DA"/>
    <text x="720" y="1340" text-anchor="middle" font-size="16" font-weight="650" fill="#355F91">必要になった時だけ、あなたに戻します。</text>
    <text x="720" y="1398" text-anchor="middle" font-size="38" font-weight="750">戻ってきた時には、何が変わったかも分かる。</text>
    <rect x="330" y="1450" width="780" height="260" rx="18" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="366" y="1492" font-size="12" font-weight="650" fill="#8A571C">対応が必要</text>
    <text x="366" y="1538" font-size="26" font-weight="750">見積書が届きました</text>
    <text x="366" y="1574" font-size="16" fill="#686864">金額と納期を確認してください。</text>
    <line x1="366" y1="1606" x2="1074" y2="1606" stroke="#E2E2DC"/>
    <text x="366" y="1643" font-size="13" fill="#777772">変わったこと</text>
    <text x="492" y="1643" font-size="14">見積書.pdf が添付されました</text>
    <text x="366" y="1680" font-size="13" fill="#777772">元のメール</text>
    <text x="492" y="1680" font-size="14" font-weight="650" fill="#355F91">山田商事との会話を見る →</text>

    <line x1="120" y1="1790" x2="1320" y2="1790" stroke="#E0E0DA"/>
    <text x="150" y="1865" font-size="16" font-weight="650" fill="#355F91">任せる。でも、決定権は渡さない。</text>
    <text x="150" y="1922" font-size="36" font-weight="750">元のメールと根拠へ、いつでも戻れる。</text>
    <text x="150" y="1963" font-size="17" fill="#686864">Lunowaの判断だけを信じさせるのではなく、何を見てそう判断したかを元のメールと一緒に確認できます。</text>

    <text x="720" y="2070" text-anchor="middle" font-size="30" font-weight="750">必要になるまで、忘れていていい。</text>
    <rect x="617" y="2104" width="206" height="52" rx="10" fill="#181817"/>
    <text x="720" y="2137" text-anchor="middle" font-size="16" font-weight="650" fill="#FFFFFF">先行アクセスに登録</text>
  </g>
</svg>