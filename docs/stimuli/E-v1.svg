<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Lunowa E-v1 Editorial Problem-First stimulus</title>
  <desc id="desc">Problem-first Lunowa homepage first-impression stimulus using the same token system and quotation monitoring state as P-v1.</desc>
  <!-- S05 E-v1. Static only. Target viewport 1440x900. Common shell/token snapshot shared with P-v1. -->
  <rect width="1440" height="900" fill="#F8F8F5"/>
  <g font-family="Inter, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" fill="#181817">
    <!-- header -->
    <text x="72" y="58" font-size="28" font-weight="700">Lunowa</text>
    <text x="1080" y="55" font-size="15" fill="#696965">仕組み</text>
    <text x="1150" y="55" font-size="15" fill="#696965">FAQ</text>
    <rect x="1215" y="27" width="153" height="44" rx="10" fill="#181817"/>
    <text x="1244" y="55" font-size="15" font-weight="650" fill="#FFFFFF">先行アクセス</text>

    <!-- editorial acquisition -->
    <text x="114" y="145" font-size="18" font-weight="600" fill="#355F91">メールで始まった未完了を、覚えておかなくていい。</text>
    <text x="114" y="208" font-size="44" font-weight="750">見積書、届いたかな。</text>
    <text x="114" y="262" font-size="44" font-weight="750">契約書、返ってきたっけ。</text>
    <text x="114" y="316" font-size="44" font-weight="750">次は自分が返す番だったかな。</text>
    <text x="114" y="372" font-size="24" font-weight="700">その確認を、Lunowaに任せる。</text>
    <text x="114" y="408" font-size="17" fill="#686864">メールの未完了を見守り、必要になった時だけあなたに戻します。</text>
    <rect x="114" y="438" width="206" height="52" rx="10" fill="#181817"/>
    <text x="217" y="471" text-anchor="middle" font-size="16" font-weight="650" fill="#FFFFFF">先行アクセスに登録</text>

    <!-- early concrete product proof -->
    <rect x="720" y="116" width="626" height="374" rx="18" fill="#FFFFFF" stroke="#D8D8D2" stroke-width="1.5"/>
    <line x1="720" y1="169" x2="1346" y2="169" stroke="#E1E1DC"/>
    <text x="744" y="150" font-size="16" font-weight="700">Lunowa</text>
    <text x="753" y="208" font-size="12" fill="#777772">メールの会話</text>
    <text x="753" y="241" font-size="22" font-weight="720">Re: 見積書のお願い</text>
    <text x="753" y="268" font-size="13" fill="#6E6E69">山田商事</text>
    <rect x="1084" y="208" width="218" height="38" rx="8" fill="#EEF4F9"/>
    <text x="1193" y="232" text-anchor="middle" font-size="12" font-weight="650" fill="#355F91">見積書を待っています</text>
    <rect x="753" y="294" width="549" height="78" rx="11" fill="#EDF6F1"/>
    <circle cx="780" cy="333" r="12" fill="#3D6D58"/>
    <path d="M774 333 l4 4 l8 -9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="807" y="326" font-size="17" font-weight="720">あなたの対応はまだ必要ありません</text>
    <text x="807" y="352" font-size="13" fill="#66706A">Lunowaが見積書の到着を引き続き見守ります。</text>
    <text x="753" y="405" font-size="11" font-weight="650" fill="#797974">最新の返信</text>
    <rect x="753" y="421" width="549" height="52" rx="9" fill="#FBFBF8" stroke="#DEDED8"/>
    <text x="773" y="453" font-size="15">社内確認中です。明日送ります。</text>

    <!-- bridge into shared narrative -->
    <line x1="94" y1="555" x2="1346" y2="555" stroke="#E0E0DA"/>
    <text x="720" y="625" text-anchor="middle" font-size="15" font-weight="650" fill="#355F91">返信が来ても、終わっていないことがある。</text>
    <text x="720" y="679" text-anchor="middle" font-size="36" font-weight="740">必要な結果が届くまで、静かに見守る。</text>
    <text x="720" y="720" text-anchor="middle" font-size="17" fill="#686864">「返信があった」ではなく、「用件が進んだか」を見て、あなたの注意を戻す時を判断します。</text>

    <!-- small scenario strip -->
    <rect x="250" y="768" width="940" height="82" rx="14" fill="#FFFFFF" stroke="#D8D8D2"/>
    <text x="282" y="798" font-size="12" fill="#777772">今</text>
    <text x="282" y="827" font-size="16" font-weight="650">社内確認中です。明日送ります。</text>
    <text x="726" y="815" font-size="15" font-weight="700" fill="#3D6D58">→ まだ対応不要。Lunowaが見守り中。</text>
  </g>
</svg>